# 内置多媒体产品发布工作流：图片和视频好友协作。
schema_version = 1
id = "product_launch"
version = "0.1.0"
enabled = true

[[steps]]
id = "image"
kind = "agent_task"
agent_id = "image"
prompt = "请为产品发布需求制定主视觉方案；有明确生成请求时调用媒体工具：{{input}}"
depends_on = []

[[steps]]
id = "video"
kind = "agent_task"
agent_id = "video"
prompt = "请根据用户需求 {{input}} 与主视觉方案 {{steps.image}} 制定视频方案；有明确生成请求时调用媒体工具。"
depends_on = ["image"]

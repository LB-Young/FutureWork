# Application defaults. User-owned copy lives at ~/.FutureWork/app.toml.
[server]
host = "127.0.0.1"
port = 8000
database_path = "data/futurework.sqlite3"
event_poll_seconds = 0.8
event_heartbeat_seconds = 15
event_batch_size = 100
message_history_limit = 100

[ui]
assistant_name = "小未"
assistant_role = "个人助理"
recent_limit = 6
suggestions = ["帮我为新产品生成一张主视觉图", "帮我分析一段视频并提出改进建议", "帮我创建一个适合重复使用的 Skill"]
default_agent_color = "#e0f1e9"
default_agent_ink = "#398d73"

[limits]
max_message_chars = 4000
max_agent_name_chars = 20
max_agent_role_chars = 80
max_agents = 30
max_plan_steps = 6
max_group_name_chars = 40
max_group_members = 12
approval_ttl_hours = 24

[matching]
minimum_proficiency = 0.70
minimum_score = 0.58
required_weight = 0.55
success_weight = 0.20
load_weight = 0.15
cost_weight = 0.10
default_success = 0.70
default_load = 0.20
default_cost = 0.30
auto_agent_proficiency = 0.85

[model]
provider = "registry"
default_model = "default_fast"
available_models = ["default_fast"]
timeout_seconds = 30
max_retries = 2
retry_backoff_seconds = 0.5
temperature = 0.4
max_output_tokens = 600
system_prompt = "你是 FutureWork 团队中的 Agent。只回答当前任务，明确说明尚未执行的工作，不要声称调用了没有提供的工具。"
mock_reply = "已记录你的消息。当前使用本地演示模型，尚未执行外部工具；配置模型 API 后可以生成实际回复。"

[permissions]
available_tools = ["calculator", "read", "glob", "grep", "write", "edit", "skill_load", "web_fetch", "url_to_md", "bash"]
safe_default_tools = ["calculator", "read", "glob", "grep", "skill_load"]
approval_required_tools = ["read_file", "glob_files", "grep_files", "write", "edit", "web_fetch", "url_to_md", "bash"]

[tool_runtime]
workspace = "workspace"
max_rounds = 4
max_calls_per_round = 3
max_result_chars = 12000
max_expression_chars = 100
max_file_bytes = 1000000
max_lines = 200
max_matches = 100
max_scanned_files = 1000
max_pattern_chars = 200
max_context_lines = 5
max_url_chars = 2048
max_web_bytes = 1000000
web_timeout_seconds = 15
web_user_agent = "FutureWork/0.1"
max_web_redirects = 3
allow_shell = false
max_command_chars = 2000
shell_timeout_seconds = 30
shell_env_allowlist = ["PATH", "LANG", "LC_ALL", "TMPDIR"]

[schedule]
poll_seconds = 10
min_interval_seconds = 60
max_prompt_chars = 4000

[worker]
recover_assigned_on_startup = true
mark_interrupted_failed = true

[execution]
run_assigned_steps_with_model = true
step_instruction = "请处理以下子任务并给出可交付的初稿。不能声称访问了未提供的外部工具、文件或实时数据。"

[assistant_routing]
skill_terms = ["skill", "技能"]
skill_creation_terms = ["创建", "制作", "编写", "改进", "审查", "更新"]

[runtime]
max_parallel_agents = 3
max_model_calls = 16

[[planner.rules]]
capability = "media.image.generate"
keywords = ["生成图片", "画图", "绘图", "图片生成"]
title = "图片创作需求与能力检查"
agent_name = "小T"
agent_role = "图片理解、生成与编辑"


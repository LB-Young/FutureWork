# External Agent execution profiles. No external friend is registered by default.
[defaults]
timeout_seconds = 120
health_timeout_seconds = 10
history_messages = 20
max_input_chars = 40000
max_output_bytes = 1000000
max_answer_chars = 50000
environment = ["PATH", "HOME", "LANG", "TMPDIR"]

[profiles.codex_local]
executable = "codex"
model = "gpt-6.2-sol"
sandbox = "workspace-write"
environment = ["PATH", "HOME", "LANG", "TMPDIR", "CODEX_HOME"]

[profiles.openclaw_local]
executable = "openclaw"
environment = ["PATH", "HOME", "LANG", "TMPDIR"]

[profiles.claude_code_local]
executable = "claude"
permission_mode = "acceptEdits"
environment = ["PATH", "HOME", "LANG", "TMPDIR", "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL"]

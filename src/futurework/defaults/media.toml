# 媒体模型按类型单独配置别名；没有密钥时由工具明确报错。
schema_version = 1

[media]
request_timeout_seconds = 120
task_timeout_seconds = 600
poll_interval_seconds = 2
max_image_bytes = 20971520
max_video_bytes = 52428800
max_video_frames = 3
video_frame_width = 768
video_timeout_seconds = 120
max_edit_seconds = 600
max_video_width = 4096
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"

[media.aliases]
image_understanding = "aliyun_qwen_vl"
image_generation = "aliyun_wanx_t2i"
image_edit = "aliyun_wanx_edit"
video_generation = "aliyun_wanx_t2v"

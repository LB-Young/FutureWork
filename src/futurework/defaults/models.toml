# Model aliases and provider instances; keys are environment references only.
schema_version = 1

[providers.deepseek]
adapter = "openai_chat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[providers.openai]
adapter = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.aliyun]
adapter = "openai_chat"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"

[providers.kimi]
adapter = "openai_chat"
base_url = "https://api.moonshot.cn/v1"
api_key_env = "MOONSHOT_API_KEY"

[providers.minimax]
adapter = "openai_chat"
base_url = "https://api.minimaxi.com/v1"
api_key_env = "MINIMAX_API_KEY"

[providers.openrouter]
adapter = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.anthropic]
adapter = "anthropic_messages"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
api_version = "2023-06-01"

[providers.mimo]
adapter = "openai_chat"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"

[providers.zhipu]
adapter = "openai_chat"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "ZHIPU_API_KEY"

[providers.ollama]
adapter = "openai_chat"
base_url = "http://127.0.0.1:11434/v1"
allow_no_key = true

[providers.vllm]
adapter = "openai_chat"
base_url = "http://127.0.0.1:8001/v1"
allow_no_key = true

[models.default_fast]
provider = "deepseek"
remote_id = "deepseek-chat"
supports_tools = true
supports_streaming = true

[models.deepseek_chat]
provider = "deepseek"
remote_id = "deepseek-chat"
supports_tools = true
[models.kimi_k3]
provider = "kimi"
remote_id = "kimi-k3"
supports_tools = true

[models.minimax_m3]
provider = "minimax"
remote_id = "MiniMax-M3"
supports_tools = true

[models.mimo_default]
provider = "mimo"
remote_id = "mimo-v2.5-pro"
supports_tools = true

[models.gpt_default]
provider = "openai"
remote_id = "gpt-4.1-mini"
supports_tools = true

[models.claude_default]
provider = "anthropic"
remote_id = "claude-sonnet-4-5"
supports_tools = true

[models.aliyun_qwen_plus]
provider = "aliyun"
remote_id = "qwen-plus"
supports_tools = true

[models.zhipu_glm]
provider = "zhipu"
remote_id = "glm-5.3-flash"
supports_tools = true

[models.ollama_local]
provider = "ollama"
remote_id = "qwen2.5:7b"
supports_tools = false

[models.vllm_local]
provider = "vllm"
remote_id = "Qwen/Qwen2.5-7B-Instruct"
supports_tools = false

[models.openrouter_default]
provider = "openrouter"
remote_id = "openai/gpt-4.1-mini"
supports_tools = true

# Context and file-backed memory limits.
schema_version = 1

[retention]
memory_days = 180

[memory]
max_prompt_memory_chars = 12000
max_experience_entry_chars = 1000
max_experience_lines = 4
max_topic_chars = 80
max_topic_slug_chars = 28
max_group_topic_files = 6
search_enabled = true
search_max_query_chars = 200
search_max_results = 8
search_max_files = 200
search_max_file_chars = 200000
search_max_result_chars = 6000
search_min_score = 2
search_max_log_lines = 50000

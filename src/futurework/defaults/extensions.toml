# 用户扩展的加载与执行限制。
schema_version = 1

[policy]
auto_enable = false
max_skill_chars = 12000

[skill_creator]
max_name_chars = 64
max_description_chars = 500
max_instructions_chars = 10000

[workflow]
max_steps = 12
max_input_chars = 4000
max_output_chars = 12000

[mcp]
timeout_seconds = 30
max_output_chars = 12000
shutdown_timeout_seconds = 1
protocol_version = "2025-03-26"

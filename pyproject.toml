[project]
name = "futurework"
version = "0.1.0"
description = "Local Agent team MVP"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "tomlkit>=0.13,<1"]

[project.scripts]
futurework = "futurework.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futurework = ["web/*", "defaults/*.toml", "defaults/agents/*.toml", "defaults/teams/*.toml"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futurework"
version = "0.1.0"
description = "Configurable local agent team application"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
futurework = "futurework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futurework = ["**/*.toml", "**/*.md", "web/*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
